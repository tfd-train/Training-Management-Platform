<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>訓練管理整合平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
    .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 25px 30px -5px rgb(0 0 0 / 0.1), 0 10px 10px -5px rgb(0 0 0 / 0.05); }
    .card-disabled { opacity: 0.75; cursor: default; background-color: #f8fafc; }
    .card-disabled:hover { transform: none; box-shadow: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 md:p-10">

  <!-- 調整寬度限制，讓 2x2 排列更集中美觀 -->
  <div class="w-full max-w-5xl space-y-12">
    
    <!-- Header -->
    <div class="text-center space-y-4">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-slate-900 text-white text-5xl shadow-2xl mb-4">
        <i class="ri-government-fill"></i>
      </div>
      <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight">訓練管理整合平台</h1>
      <p class="text-slate-500 text-xl font-medium">臺北市政府消防局訓練中心</p>
    </div>

    <!-- Cards Container -->
    <!-- 強制設定 md 以上為 2欄 (上2下2佈局) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- System 1: Training Flow (Blue) -->
      <a href="https://tfd-train.github.io/Training-Flow-Management/" class="group block bg-white rounded-[2.5rem] p-8 md:p-10 border border-slate-200 shadow-lg card-hover relative overflow-hidden h-full">
        <div class="absolute top-0 right-0 w-48 h-48 bg-blue-50 rounded-bl-[6rem] -mr-12 -mt-12 transition duration-500 group-hover:bg-blue-100"></div>
        <div class="relative z-10 flex flex-col h-full">
          <div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center text-white text-3xl mb-6 shadow-lg shadow-blue-500/30">
            <i class="ri-flow-chart"></i>
          </div>
          <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4 group-hover:text-blue-600 transition">訓練流路管理</h2>
          <p class="text-slate-500 text-base leading-relaxed mb-8 flex-grow">
            規劃年度訓練課程、消防/非消防人員班期安排、甘特圖排程與 A3 報表輸出。
          </p>
          <div class="flex items-center text-base font-bold text-blue-600 mt-auto">
            進入系統 <i class="ri-arrow-right-line ml-2 text-xl transition-transform group-hover:translate-x-2"></i>
          </div>
        </div>
      </a>

      <!-- System 2: Venue Booking (Indigo) -->
      <a href="https://tfd-train.github.io/Facility-Booking/" class="group block bg-white rounded-[2.5rem] p-8 md:p-10 border border-slate-200 shadow-lg card-hover relative overflow-hidden h-full">
        <div class="absolute top-0 right-0 w-48 h-48 bg-indigo-50 rounded-bl-[6rem] -mr-12 -mt-12 transition duration-500 group-hover:bg-indigo-100"></div>
        <div class="relative z-10 flex flex-col h-full">
          <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-3xl mb-6 shadow-lg shadow-indigo-500/30">
            <i class="ri-building-2-fill"></i>
          </div>
          <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4 group-hover:text-indigo-600 transition">場地借用管理</h2>
          <p class="text-slate-500 text-base leading-relaxed mb-8 flex-grow">
            訓練場地預約申請、防撞期檢核、自動同步 Google 日曆與使用紀錄照片上傳。
          </p>
          <div class="flex items-center text-base font-bold text-indigo-600 mt-auto">
            進入系統 <i class="ri-arrow-right-line ml-2 text-xl transition-transform group-hover:translate-x-2"></i>
          </div>
        </div>
      </a>

      <!-- System 3: EV Training Statistics (Emerald) -->
      <a href="https://tfd-train.github.io/Electric-Vehicle/" class="group block bg-white rounded-[2.5rem] p-8 md:p-10 border border-slate-200 shadow-lg card-hover relative overflow-hidden h-full">
        <div class="absolute top-0 right-0 w-48 h-48 bg-emerald-50 rounded-bl-[6rem] -mr-12 -mt-12 transition duration-500 group-hover:bg-emerald-100"></div>
        <div class="relative z-10 flex flex-col h-full">
          <div class="w-16 h-16 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-3xl mb-6 shadow-lg shadow-emerald-500/30">
            <i class="ri-charging-pile-2-fill"></i>
          </div>
          <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4 group-hover:text-emerald-600 transition">電動車訓練統計</h2>
          <p class="text-slate-500 text-base leading-relaxed mb-8 flex-grow">
            電動車救援訓練場次與人數管理、智慧日曆批次輸入、雲端資料庫同步與報表匯出。
          </p>
          <div class="flex items-center text-base font-bold text-emerald-600 mt-auto">
            進入系統 <i class="ri-arrow-right-line ml-2 text-xl transition-transform group-hover:translate-x-2"></i>
          </div>
        </div>
      </a>

      <!-- System 4: Physical Fitness (Cyan) - 已上線版本 -->
      <a href="https://tfd-train.github.io/Fitness-Record/" class="group block bg-white rounded-[2.5rem] p-8 md:p-10 border border-slate-200 shadow-lg card-hover relative overflow-hidden h-full">
        <div class="absolute top-0 right-0 w-48 h-48 bg-cyan-50 rounded-bl-[6rem] -mr-12 -mt-12 transition duration-500 group-hover:bg-cyan-100"></div>
        <div class="relative z-10 flex flex-col h-full">
          <div class="w-16 h-16 rounded-2xl bg-cyan-600 flex items-center justify-center text-white text-3xl mb-6 shadow-lg shadow-cyan-500/30">
            <i class="ri-run-fill"></i>
          </div>
          <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4 group-hover:text-cyan-600 transition">體能成績管理</h2>
          <p class="text-slate-500 text-base leading-relaxed mb-8 flex-grow">
            常年訓練新式體能測驗成績登錄、個人數據追蹤與成績統計分析管理。
          </p>
          <div class="flex items-center text-base font-bold text-cyan-600 mt-auto">
            進入系統 <i class="ri-arrow-right-line ml-2 text-xl transition-transform group-hover:translate-x-2"></i>
          </div>
        </div>
      </a>

    </div>

    <!-- Footer -->
    <div class="text-center text-slate-400 text-sm mt-16 pt-8 border-t border-slate-200">
      &copy; <span id="current-year"></span> Taipei City Fire Department Training Center.
    </div>
  </div>

  <script>
    // 自動更新頁尾年份
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
